name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Web (teszt + build + API füstteszt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npx prisma db push
      - name: Egységtesztek
        run: npm test
      - name: Demó-adatok betöltése
        run: npm run db:seed
      - name: Production build
        run: npm run build
      - name: API füstteszt élő szerver ellen
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health && break
            sleep 1
          done
          bash e2e/api-test.sh

  mobile:
    name: Mobil (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image build (a Dockerfile validálása)
        run: docker build -t lmur:ci .
