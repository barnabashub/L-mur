name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Web (teszt + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npx prisma db push
      - name: Egységtesztek
        run: npm test
      - name: Demó-adatok betöltése
        run: npm run db:seed
      - name: Production build
        run: npm run build

  mobile:
    name: Mobil (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
